<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Revisão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  </head>
  <body>
    <h1>Atividade Cronometrada - Revisão</h1>

    <h4>ID</h4>
    <input id="id" disabled>
    <h4>Nome</h4>
    <input type="text" id="inputNome">
    <h4>Sexo</h4>
    <select id="selectSexo">
      <option type="text" value="Não informado">Selecione</option>
      <option type="text" value="Masculino">Masculino</option>
      <option type="text" value="Feminino">Feminino</option>
      <option type="text" value="Preferiu não informar">Não Informar</option>
    </select><br><br>
    <h4>Status</h4>
    <select id="selectStatus">
      <option type="text" value="Ativado">Ativado</option>
      <option type="text" value="Desativado">Desativado</option>
    </select> <br><br>

    <button type="button" id="adicionar">Adicionar</button>
    <button type="button" id="Listar">Listar</button>
    <button type="button" id="Excluir">Excluir</button>
    <button type="button" id="Editar">Editar</button>
    <br><br>
    

    <table>
      <thead>
          <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Sexo</th>
              <th>Status</th>
          </tr>
      </thead>
      <tbody id = "conteudo">
          <tr>
              <td>10</td>
              <td>Lucas</td>
              <td>Masculino</td>
              <td>Ativado</td>
          </tr>
      </tbody>
  </table>
  

    
  <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  </body>
</html>
