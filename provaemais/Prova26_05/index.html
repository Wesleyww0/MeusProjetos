<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prova</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

  <body>
    <h1>Prova</h1>

    <p>ID</p>
    <input id="id" disabled>
    <p>Titulo</p>
    <input type="text" id="titulo">
    <p>Descricao</p>
    <input type="text" id="descricao">
    <p>Prioridade</p>
    <select id="selectPrioridade">
      <option type="text" value="baixa">Baixa</option>
      <option type="text" value="media">Media</option>
      <option type="text" value="alta">Alta</option>
    </select><br><br>
   

    <button type="button" id="btnGravar">Gravar</button>
    
    <br><br>
    

    <table> 
      <thead>
          <tr>
              <th>ID</th>
              <th>Titulo</th>
              <th>Descrição</th>
              <th>Prioridade</th>
              <th>Ações</th>
          </tr>
      </thead>
      <tbody id = "conteudo">
          
      </tbody>
  </table>
  

    
  <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
