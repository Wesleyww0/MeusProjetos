<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1 - cadastro de Produtos e Serviços</title>
    <style>
        .esconder {
            display: none !important;
        }

        .exibir {
            display: block !important;
        }
        .msg-geral {
            /* display : none*/
            color: red;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 10px;
            background-color: rgb(242, 216, 216);
            padding: 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="msg-geral esconder">
        

    </div>
    <p>Cadastro de Produtos e Serviços</p>
    
    <select id="selectTipo" >
        <option value="3">Selecione</option>
        <option value="1">Produtos</option>
        <option value="2">Serviços</option>
    </select><br><br>
    <button type="button" id="btnAbrir">Abrir</button><br><br>

    <div class="esconder" id="selectTipo1">
        <p>Descrição do Produto</p>
        <input type="text" id="descricaoDoProduto"> <br>
        <p>Categoria</p>
        <input type="text" id="categoria"> <br>
        <p>Valor à vista</p>
        <input type="text" id="valorAVista"> <br><br>
        <p>Valor à Prazo</p> <!-- (+5% do valor à vista e somente em compras acima de 1000) -->
        <input type="text" id="valorAPrazo"> <br><br>
    </div>

    <div class="esconder" id="selectTipo2"> 
        <p>Descrição do Serviço</p>
        <input type="text" id="descricaoDoServico"><br>
        <p>Valor em Peças</p>
        <input type="text" id="valorEmPecas"><br>
        <p>Valor Mão de Obra</p> <!-- (Valor não pode ultrapassar 50% do valor das peças) -->
        <input type="text" id="valorMaoDeObra"><br><br>
    </div>
<button type="button" id="btnSalvar">Salvar</button>
    
</body>
<script src="app.js"></script>
</html>
