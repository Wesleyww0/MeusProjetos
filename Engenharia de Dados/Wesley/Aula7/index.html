<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objetos</title>
</head>
<body>

<form>
    <p>Nome:</p>
    <input type="text" id="nome">
    <p>Idade:</p>
    <input type="text" id="idade">
    <p>Altura:</p>
    <input type="text" id="altura">
    <p>Salario</p>
    <input type="text" id="salario"><br><br><br>
    
    <select id="selectCasado">
        <option value="">É Casado?</option>
        <option value="sim">SIM</option>
        <option value="nao">NÃO</option>
    </select><br><br>
    <p>conhecimentos</p>
    <label for="php">
        <input type="checkbox" id="php" value="PHP">PHP
    </label>
    <label for="Java">
        <input type="checkbox" id="java" value="Java">Java
    </label>
    <label for="csharp">
        <input type="checkbox" id="csharp" value="C#">C#
    </label>
    <label for="JavaScript">
        <input type="checkbox" id="javascript" value="JavaScript">JavaScript
    </label><br><br><br>
   


    <button type="button" id="gravar">Gravar</button>
    <button type="button" id="exibir">Exibir Dados</button><br>

    <div id="resultado"></div>
</form>
    
</body>
<script src="app.js"></script>
</html>
